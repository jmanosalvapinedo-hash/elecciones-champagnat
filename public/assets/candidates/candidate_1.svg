  <polygon points="100,165 122,140 112,135" fill="#1d4ed8"/>
  <!-- School Tie (Gold/Blue striped) -->
  <polygon points="97,135 103,135 105,175 100,182 95,175" fill="#d97706"/>
  <!-- School Badge -->
  <circle cx="68" cy="165" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
