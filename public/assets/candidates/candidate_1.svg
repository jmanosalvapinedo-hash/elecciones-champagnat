  <path d="M82 87 Q88 84 94 87" stroke="#2d221e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M106 87 Q112 84 118 87" stroke="#2d221e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Smile -->
  <path d="M90 112 Q100 124 110 112" stroke="#b45309" stroke-width="3" fill="#ffffff" stroke-linecap="round"/>
  <!-- School Uniform Collar and Blazer -->
  <!-- White Shirt -->
