      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skin1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd5b8"/>
      <stop offset="100%" stop-color="#f6be98"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bg1)"/>
  <circle cx="100" cy="100" r="92" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <!-- Hair back -->
  <path d="M60 90 Q100 45 140 90 Q145 60 100 45 Q55 60 60 90 Z" fill="#2d221e"/>
