<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Traditional Heraldic School Shield Shape -->
  <path d="M100 12 L185 35 C185 130 150 195 100 230 C50 195 15 130 15 35 Z" 
        fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="7" stroke-linejoin="round"/>
  
  <!-- Inner Golden Border -->
  <path d="M100 22 L175 42 C175 125 143 185 100 216 C57 185 25 125 25 42 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Cross at Top -->
  <rect x="94" y="40" width="12" height="34" fill="url(#goldGrad)" rx="2"/>
  <rect x="83" y="49" width="34" height="11" fill="url(#goldGrad)" rx="2"/>

  <!-- Traditional Marist "M" Monogram (Champagnat) -->
  <g fill="url(#goldGrad)">
    <!-- Central stylized Marist M -->
    <path d="M50 148 L65 78 L85 130 L100 95 L115 130 L135 78 L150 148 L136 148 L126 100 L110 140 L90 140 L74 100 L64 148 Z"/>
    
    <!-- Three Violets / Stars of Champagnat (Humildad, Sencillez, Modestia) -->
    <!-- Star 1 -->
    <circle cx="70" cy="165" r="5"/>
    <!-- Star 2 -->
    <circle cx="100" cy="172" r="6"/>
    <!-- Star 3 -->
    <circle cx="130" cy="165" r="5"/>
  </g>

  <!-- School Ribbon / Banner -->
  <path d="M35 190 Q100 205 165 190 Q100 215 35 190 Z" fill="url(#goldGrad)"/>
  <text x="100" y="202" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1">CHAMPAGNAT</text>
</svg>
